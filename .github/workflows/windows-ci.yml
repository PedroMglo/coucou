name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Nothing is packed and nothing is published: releases stay in windows.yml,
# which only runs on tags.

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/test-whats-new.py'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      # Isolate the loader failure from restored executables and native DLLs.
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-ci-cargo-source-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-source-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # Every release brings its "What's new" in the 12 languages (src/whats-new/whats-new.json).
      - name: What's new for this version
        run: python ../scripts/test-whats-new.py windows

      # The app bundles target/release/coucou-hook.exe as a resource, and its
      # build script refuses to run until that file exists. One command per
      # step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p coucou-hook

      - name: Rust tests
        id: rust_tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'coucou-rust-tests.log'
          cargo test --workspace --locked 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          $loaderFailure = Select-String -Path $log -SimpleMatch 'STATUS_ENTRYPOINT_NOT_FOUND' -Quiet
          "loader_failure=$($loaderFailure.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit $status

      - name: Identify the DLL entry point missing from the test executable
        if: failure() && steps.rust_tests.outputs.loader_failure == 'true'
        timeout-minutes: 2
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $image = Get-ChildItem target/debug/build -Recurse -File -Filter 'coucou_lib-*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$image) { throw 'The Rust test executable was not found' }
          $debuggers = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64'
          $cdb = Join-Path $debuggers 'cdb.exe'
          $gflags = Join-Path $debuggers 'gflags.exe'
          $trace = Join-Path $env:RUNNER_TEMP 'coucou-loader.log'
          if ((Test-Path $cdb) -and (Test-Path $gflags)) {
            & $gflags /i $image.Name +sls
            try {
              & $cdb -logo $trace -g -G -c 'sxd 0xc0000139; g; q' $image.FullName --list | Out-Null
              Get-Content $trace | Select-String -Pattern 'Ldrp.*ERROR|0xc0000139|entry point|could not be located'
            } finally {
              & $gflags /i $image.Name -sls
            }
          } else {
            llvm-objdump -p $image.FullName
          }
