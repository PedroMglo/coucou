<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conversa flutuante</title></head><body class="floating-chat">
<header id="handle"><div><div class="chat-identity"><strong id="owner">Conversa</strong><span id="origin"></span></div><span id="source"></span></div><label title="Opacidade da superfície">◐ <input id="opacity" type="range" min="55" max="100" value="100" aria-label="Opacidade da conversa"></label><button id="size" title="Alternar tamanho" aria-label="Alternar tamanho da conversa">⛶</button><button id="close" title="Fechar sem interromper a tarefa" aria-label="Fechar conversa">×</button></header>
<div id="chat-layout" class="sidebar-collapsed">
<aside id="sessions" hidden aria-label="Sessões e conversas"><div class="sidebar-heading"><strong>Sessões</strong><button id="sessions-close" aria-label="Recolher lista de sessões">‹</button></div><button id="new-session" title="Criar uma conversa com este pet">＋ Nova conversa</button><button id="new-codex" hidden title="Criar uma sessão Codex que pode continuar no terminal, sem enviar uma mensagem">＋ Nova sessão Codex</button><input id="session-search" type="search" placeholder="Pesquisar por nome ou pasta…" aria-label="Pesquisar sessões deste pet" aria-controls="session-list"><div id="session-list" aria-label="Conversas e terminais deste pet"></div><p class="sidebar-hint">Ctrl + K para pesquisar</p></aside>
<section id="chat-main"><div id="session-tools"><button id="sessions-toggle" aria-expanded="false" aria-controls="sessions" title="Mostrar ou recolher as sessões (Ctrl + K)">☰ Sessões</button><span id="selected-session"></span><button id="sessions-refresh" aria-label="Atualizar sessões" title="Atualizar sessões">↻</button><button id="terminal" hidden aria-label="Abrir o terminal desta sessão" title="Abrir o terminal desta sessão">↗ Terminal</button></div><div id="managed-session" hidden><p id="managed-description"></p><div><button id="managed-open">Abrir no terminal</button><button id="managed-release" title="Deixar de gerir esta sessão no Coucou, sem fechar o terminal nem apagar o histórico">Retirar da gestão</button></div></div><p id="feedback" role="status" hidden></p><main id="conversation"></main></section>
</div>
<script type="module" src="/src/desktop/pet-chat.ts"></script></body></html>
